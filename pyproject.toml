[project]
name = "web-scraping-data-extraction"
version = "1.0.0"
description = "Professional Python web scraping and data extraction tool."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = [
    "tests"
]

[tool.black]
line-length = 88
target-version = [
    "py312"
]

[tool.isort]
profile = "black"
line_length = 88